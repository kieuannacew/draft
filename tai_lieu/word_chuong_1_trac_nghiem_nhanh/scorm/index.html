<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<title>Word – Chương 1: Trắc nghiệm nhanh</title>
<style>
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#FAF9F6;color:#1E2A1D}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px}
  h1{font-size:24px;margin:0 0 4px;color:#2D4A2B}
  .sub{color:#5F6857;margin-bottom:18px}
  .bar{height:8px;background:#ECEFE3;border-radius:4px;overflow:hidden;margin-bottom:22px}
  .bar div{height:100%;background:#3E7B3A;width:0;transition:width .3s}
  .card{background:#fff;border:1px solid #E3E1D6;border-radius:16px;padding:22px 24px}
  .q{font-size:18px;font-weight:600;margin-bottom:4px}
  .en{color:#7D8471;font-size:13px;margin-bottom:14px}
  button.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:12px;
    border:1px solid #CDD3BC;background:#fff;font-size:15px;cursor:pointer}
  button.opt:hover{background:#ECEFE3}
  button.opt.ok{background:#EAF3E4;border-color:#3E7B3A;color:#3E7B3A;font-weight:600}
  button.opt.bad{background:#F8E9E4;border-color:#B5533C;color:#B5533C}
  .why{margin-top:12px;padding:10px 14px;border-radius:10px;background:#F7EFD9;color:#5C4410;display:none}
  .next{margin-top:16px;padding:10px 22px;border:0;border-radius:12px;background:#2D4A2B;color:#fff;font-size:15px;
    cursor:pointer;display:none}
  .done{text-align:center}
  .big{font-size:56px;margin:8px 0}
</style></head>
<body><div class="wrap">
  <h1>Word – Chương 1: Quản lý tài liệu</h1>
  <div class="sub">Trắc nghiệm nhanh · Quick quiz — <span id="count"></span></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="card" id="card"></div>
</div>
<script>
var QS = [
  {q:"Muốn thêm hình mờ chữ “DRAFT” vào tài liệu, bạn vào đâu?", en:"Where do you add a “DRAFT” text watermark?",
   o:["Insert → Text Box","Design → Watermark → Custom Watermark","Layout → Watermark","Review → Protect"], a:1,
   w:"Design → Page Background → Watermark → Custom Watermark → Text watermark."},
  {q:"Đổi thuộc tính Tác giả (Author) của tài liệu ở đâu?", en:"Where do you change the document Author property?",
   o:["File → Info → Properties","Home → Styles","View → Properties","Insert → Header"], a:0,
   w:"File → Info → Properties (hoặc Show All Properties) → Author."},
  {q:"Muốn tìm và xóa thông tin cá nhân ẩn trong tài liệu, dùng lệnh nào?", en:"Which command finds and removes hidden personal information?",
   o:["Check Accessibility","Check Compatibility","Inspect Document","Restrict Editing"], a:2,
   w:"File → Info → Check for Issues → Inspect Document."},
  {q:"Lưu tài liệu dưới dạng PDF bằng cách nào?", en:"How do you save a document as PDF?",
   o:["File → Save As → chọn PDF (*.pdf)","Insert → Object → PDF","Home → Paste → PDF","View → Read Mode"], a:0,
   w:"File → Save As (hoặc Export → Create PDF/XPS)."},
  {q:"Chèn liên kết đến một bookmark trong tài liệu dùng lệnh nào?", en:"Which command links to a bookmark in the document?",
   o:["Insert → Cross-reference","Insert → Link → Place in This Document","References → Citation","Insert → Bookmark"], a:1,
   w:"Insert → Link → Place in This Document → chọn bookmark."},
  {q:"Hiện các ký tự ẩn (dấu đoạn, tab…) bằng nút nào?", en:"Which button shows hidden formatting symbols?",
   o:["Home → Show/Hide ¶","View → Gridlines","Layout → Hyphenation","Review → Markup"], a:0,
   w:"Home → Paragraph → Show/Hide ¶ (Ctrl+Shift+8)."}
];
var api = null;
function findAPI(w){ for (var i=0; w && i<10; i++){ if (w.API) return w.API; if (w.parent===w) break; w=w.parent; } return null; }
api = findAPI(window) || (window.opener && findAPI(window.opener));
if (api) { api.LMSInitialize(""); if (api.LMSGetValue("cmi.core.lesson_status")==="not attempted") api.LMSSetValue("cmi.core.lesson_status","incomplete"); api.LMSCommit(""); }
var i = 0, right = 0;
var start = api ? parseInt(api.LMSGetValue("cmi.core.lesson_location")||"0",10) : 0;
if (start>0 && start<QS.length) { i = start; right = parseInt(api.LMSGetValue("cmi.suspend_data")||"0",10)||0; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function show(){
  document.getElementById("bar").style.width = (i/QS.length*100)+"%";
  document.getElementById("count").textContent = (i<QS.length? "Câu "+(i+1)+"/"+QS.length : "Hoàn thành");
  var c = document.getElementById("card");
  if (i>=QS.length) return finish(c);
  var q = QS[i], h = '<div class="q">'+esc(q.q)+'</div><div class="en">'+esc(q.en)+'</div>';
  q.o.forEach(function(o,k){ h += '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'; });
  h += '<div class="why" id="why"></div><button class="next" id="next">Câu tiếp · Next ›</button>';
  c.innerHTML = h;
  var answered = false;
  c.querySelectorAll(".opt").forEach(function(b){ b.onclick = function(){
    if (answered) return; answered = true;
    var k = +b.dataset.k;
    if (k===q.a) { right++; b.classList.add("ok"); } else { b.classList.add("bad"); c.querySelectorAll(".opt")[q.a].classList.add("ok"); }
    var why = document.getElementById("why"); why.textContent = (k===q.a?"✓ Đúng! ":"✗ Chưa đúng. ")+q.w; why.style.display="block";
    document.getElementById("next").style.display="inline-block";
  };});
  document.getElementById("next").onclick = function(){
    i++;
    if (api){ api.LMSSetValue("cmi.core.lesson_location", String(i)); api.LMSSetValue("cmi.suspend_data", String(right)); api.LMSCommit(""); }
    show();
  };
}
function finish(c){
  var score = Math.round(right/QS.length*100), pass = score>=70;
  c.innerHTML = '<div class="done"><div class="big">'+(pass?"🎉":"💪")+'</div><div class="q">Bạn đúng '+right+'/'+QS.length+' câu · '+score+' điểm</div>'+
    '<div class="en">'+(pass?"Đạt! Bấm “Thực hành ngay” ở trên để làm bài trên Word.":"Chưa đạt 70 – xem lại slide rồi làm lại nhé.")+'</div>'+
    '<button class="next" style="display:inline-block" onclick="restart()">Làm lại · Retry</button></div>';
  if (api){
    api.LMSSetValue("cmi.core.score.raw", String(score)); api.LMSSetValue("cmi.core.score.max","100"); api.LMSSetValue("cmi.core.score.min","0");
    api.LMSSetValue("cmi.core.lesson_status", pass?"passed":"failed");
    api.LMSSetValue("cmi.core.lesson_location","0"); api.LMSSetValue("cmi.suspend_data","0");
    api.LMSCommit(""); api.LMSFinish("");
  }
}
function restart(){ i=0; right=0; show(); }
show();
</script></body></html>
